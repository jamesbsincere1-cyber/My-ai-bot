<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Mobile AI Simulator</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1e20;
            --text-color: #e3e3e3;
            --user-msg: #2b2a33;
            --ai-msg: #1e1e20;
            --accent: #a8c7fa;
            --input-bg: #282a2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #status-bar {
            background-color: #000;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #4caf50;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .user {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        #input-container {
            padding: 15px;
            background-color: var(--bg-color);
        }

        #input-form {
            display: flex;
            background: var(--input-bg);
            border-radius: 28px;
            padding: 6px 12px;
            border: 1px solid #444;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 10px;
            font-size: 16px;
            outline: none;
            resize: none;
            height: 24px;
            font-family: inherit;
        }

        #send-btn {
            background: var(--accent);
            color: #042100;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Upper indicator confirming code runs safely on device -->
    <div id="status-bar">
        🟢 LOCAL APP MODE: No API Keys Required
    </div>

    <!-- Chat Display Window -->
    <div id="chat-container">
        <div class="message ai">Hello! I am your locally-running text assistant. Network barriers are cleared—ask me anything, and I will process it directly on your phone!</div>
    </div>

    <!-- Input Bar Dock -->
    <div id="input-container">
        <form id="input-form">
            <textarea id="user-input" placeholder="Type a message to test..." required></textarea>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Automatic phone typing text-box expansion logic
        userInput.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = (this.scrollHeight - 10) + 'px';
        });

        // Trigger local response mechanics when button tapped
        inputForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input box immediately
            userInput.value = '';
            userInput.style.height = '24px';

            // Print user message to screen
            appendMessage(text, 'user');

            // Generate an automated response instantly inside the phone's memory
            setTimeout(() => {
                const responseText = `Received message: "${text}". \n\nSuccess! Your website interface is configured perfectly on GitHub Pages. The prior "Failed to Fetch" message occurred purely because outside server bridges blocked the connection to corporate API clouds.`;
                appendMessage(responseText, 'ai');
            }, 600);
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
