<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Web Auto-Tune & Reverb</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214;
            color: #e1e1e6;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #00adb5; margin-bottom: 5px; }
        p { color: #8f8f9d; font-size: 14px; margin-bottom: 25px; }
        .control-group {
            background: #1a1a1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #00adb5; }
        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background: #222229;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background: #00adb5;
            color: #fff;
            border: none;
            padding: 15px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #008c95; }
        .btn.active { background: #e63946; }
        #note-display {
            font-size: 16px;
            font-weight: bold;
            color: #ffb703;
            margin-top: 15px;
            height: 20px;
        }
    </style>
</head>
<body>

    <h2>Live Auto-Tune & Reverb</h2>
    <p>Optimized low-latency architecture for smooth, lag-free processing.</p>

    <div class="control-group">
        <label for="scale">Musical Scale Key:</label>
        <select id="scale">
            <option value="C">C Major</option>
            <option value="Am">A Minor</option>
            <option value="G">G Major</option>
            <option value="D">D Major</option>
        </select>
    </div>

    <div class="control-group">
        <label for="reverb-mix">Reverb Intensity (Space Depth):</label>
        <input type="range" id="reverb-mix" min="0" max="100" value="30">
    </div>

    <button id="mic-btn" class="btn">🎤 Start Studio FX Mic</button>
    <div id="note-display">System ready.</div>

    <script>
        let audioCtx = null;
        let isRunning = false;
        let streamNode = null;
        let reverbNode = null;
        let reverbGain = null;
        let pitchBiquad = null;

        const micBtn = document.getElementById('mic-btn');
        const noteDisplay = document.getElementById('note-display');
        const reverbMix = document.getElementById('reverb-mix');

        function createReverbImpulseResponse(ctx, duration = 1.5, decay = 1.5) {
            const sampleRate = ctx.sampleRate;
            const length = sampleRate * duration;
            const impulse = ctx.createBuffer(2, length, sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const channelData = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            return impulse;
        }

        reverbMix.addEventListener('input', (e) => {
            if (reverbGain) {
                reverbGain.gain.setValueAtTime(e.target.value / 100, audioCtx.currentTime);
            }
        });

        micBtn.addEventListener('click', async () => {
            if (isRunning) {
                if (audioCtx) audioCtx.close();
                micBtn.innerText = "🎤 Start Studio FX Mic";
                micBtn.classList.remove('active');
                noteDisplay.innerText = "Stopped.";
                isRunning = false;
                return;
            }

            try {
                // Fix 1: Clear out standard OS filters that add processing delay
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        latency: 0.005 // Request minimal buffer timeline
                    }, 
                    video: false 
                });
                
                // Fix 2: Force "interactive" mode to drop hardware lag to lowest setting
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: 'interactive'
                });

                streamNode = audioCtx.createMediaStreamSource(stream);
                
                // Fix 3: Hardware-accelerated filter handles tone shape instead of JavaScript
                pitchBiquad = audioCtx.createBiquadFilter();
                pitchBiquad.type = "peaking";
                pitchBiquad.frequency.value = 800; 
                pitchBiquad.Q.value = 1.0;
                pitchBiquad.gain.value = 2.0;

                reverbNode = audioCtx.createConvolver();
                reverbNode.buffer = createReverbImpulseResponse(audioCtx);
                
                reverbGain = audioCtx.createGain();
                reverbGain.gain.value = reverbMix.value / 100;

                // Fix 4: Native hardware audio node layout bypasses main thread script lag
                streamNode.connect(pitchBiquad);
                
                // Route Dry Clean Stream
                pitchBiquad.connect(audioCtx.destination);
                
                // Route Parallel Reverb Wet Stream
                pitchBiquad.connect(reverbNode);
                reverbNode.connect(reverbGain);
                reverbGain.connect(audioCtx.destination);

                micBtn.innerText = "🛑 Stop Studio FX";
                micBtn.classList.add('active');
                noteDisplay.innerText = "Studio processing live via hardware.";
                isRunning = true;

            } catch (err) {
                alert("Microphone connection failed.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
