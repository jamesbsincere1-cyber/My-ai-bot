<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline 1080p Video Upscaler</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214;
            color: #e1e1e6;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #00adb5; margin-bottom: 5px; }
        p { color: #8f8f9d; font-size: 14px; margin-bottom: 25px; }
        .dropzone {
            border: 2px dashed #00adb5;
            padding: 30px;
            border-radius: 8px;
            background: #1a1a1e;
            cursor: pointer;
            transition: 0.2s;
        }
        .dropzone:hover { background: #222229; }
        input[type="file"] { display: none; }
        .btn {
            background: #00adb5;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        .btn:hover { background: #008c95; }
        
        /* Progress Container Styles */
        .progress-container {
            margin-top: 20px;
            background: #222229;
            border-radius: 20px;
            height: 20px;
            width: 100%;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            background: #00adb5;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffb703;
            font-weight: 500;
        }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <h2>Offline Video Upscaler</h2>
    <p>Upscales video formats natively to Full HD 1080p with live progress tracking.</p>

    <div class="dropzone" onclick="document.getElementById('video-input').click()">
        <span id="box-text">📷 Click here to select your video file</span>
        <input type="file" id="video-input" accept="video/*,.3gp" />
    </div>

    <button id="process-btn" class="btn">Process to Full HD (1080p)</button>
    
    <!-- Added Progress Bar elements -->
    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div id="status"></div>

    <video id="hidden-video" muted playsinline></video>
    <canvas id="upscale-canvas" width="1920" height="1080"></canvas>

    <script>
        const fileInput = document.getElementById('video-input');
        const boxText = document.getElementById('box-text');
        const processBtn = document.getElementById('process-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const status = document.getElementById('status');
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('upscale-canvas');
        const ctx = canvas.getContext('2d');

        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                boxText.innerText = "Selected: " + selectedFile.name;
                processBtn.style.display = "block";
                progressContainer.style.display = "none";
                progressBar.style.width = "0%";
                status.innerText = "File loaded. Ready to upscale.";
            }
        });

        processBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            status.innerText = "Initializing 1080p Canvas Engine...";
            processBtn.disabled = true;
            processBtn.style.opacity = "0.5";
            progressContainer.style.display = "block";

            const fileURL = URL.createObjectURL(selectedFile);
            video.src = fileURL;

            video.onloadedmetadata = () => {
                video.play();
                
                const stream = canvas.captureStream(30); 
                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp9', 
                    videoBitsPerSecond: 5000000 
                });

                let chunks = [];
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

                mediaRecorder.onstop = () => {
                    progressBar.style.width = "100%";
                    status.innerText = "Upscaling compile complete! Downloading output file...";
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const downloadUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = "upscaled_1080p_" + selectedFile.name.split('.')[0] + ".webm";
                    a.click();

                    processBtn.disabled = false;
                    processBtn.style.opacity = "1";
                    status.innerText = "Done! Saved to downloads folder.";
                };

                mediaRecorder.start();

                function drawFrame() {
                    if (video.paused || video.ended) {
                        mediaRecorder.stop();
                        return;
                    }
                    
                    // Calculate real-time percentage
                    if (video.duration) {
                        const percent = (video.currentTime / video.duration) * 100;
                        progressBar.style.width = percent + "%";
                        status.innerText = "Processing: " + Math.floor(percent) + "% complete";
                    }

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    requestAnimationFrame(drawFrame);
                }
                
                drawFrame();
            };
        });
    </script>
</body>
</html>
