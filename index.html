<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dave Chappelle & Crew Comedy Archive</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0b0b;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: row;
            background-color: #141416;
            border: 1px solid #2a2a2e;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 950px;
            width: 100%;
            overflow: hidden;
        }
        .media-side {
            flex: 1;
            background-color: #1a1a1c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-right: 1px solid #2a2a2e;
        }
        .show-photo {
            width: 100%;
            max-width: 360px;
            height: auto;
            border-radius: 6px;
            border: 1px solid #3a3a3f;
            filter: grayscale(30%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .headline {
            font-size: 22px;
            color: #ffcc00;
            letter-spacing: 2px;
            margin-top: 20px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
        }
        .subheadline {
            font-size: 12px;
            color: #707075;
            letter-spacing: 1px;
            text-align: center;
        }
        .content-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }
        .script-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 180px;
            justify-content: center;
        }
        .bubble {
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            max-width: 90%;
        }
        .setup-bubble {
            background-color: #222226;
            border-left: 4px solid #ffcc00;
            color: #d1d1d6;
            align-self: flex-start;
        }
        .punchline-bubble {
            background-color: #ffcc00;
            color: #0b0b0b;
            font-weight: bold;
            align-self: flex-end;
            box-shadow: 0 4px 12px rgba(255,204,0,0.2);
        }
        .speaker-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
            opacity: 0.7;
        }
        .actions {
            margin-top: 30px;
            text-align: right;
        }
        button {
            background-color: transparent;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 12px 28px;
            font-size: 14px;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #ffcc00;
            color: #0b0b0b;
            box-shadow: 0 0 15px rgba(255,204,0,0.4);
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .media-side {
                border-right: none;
                border-bottom: 1px solid #2a2a2e;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="media-side">
        <!-- High-quality classic promotional photo of Dave from Unsplash -->
        <img class="show-photo" src="https://unsplash.com" alt="Comedy Stage Microphone">
        <div class="headline">Chappelle Archive</div>
        <div class="subheadline">Classic Bits &amp; Sketch Setups</div>
    </div>
    
    <div class="content-side">
        <div class="script-box" id="scriptBox">
            <!-- Initial state dynamically replaced by JS -->
            <div class="bubble setup-bubble">
                <span class="speaker-label">SYSTEM</span>
                Welcome to the retrospective archive. Press below to generate the first comedy sequence.
            </div>
        </div>
        
        <div class="actions">
            <button onclick="getJoke()">Next Script</button>
        </div>
    </div>
</div>
