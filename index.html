<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local 3GP Video Converter</title>
    <!-- 1. Load FFmpeg WebAssembly libraries -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px; }
        .btn { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; display: block; width: 100%; margin-top: 15px; }
        .progress { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h2>3GP to Full HD Converter</h2>
    
    <input type="file" id="video-input" accept=".3gp" />
    
    <label style="display:block; margin-top:15px;">Target Resolution:</label>
    <select id="resolution">
        <option value="1920x1080">1080p Full HD (1920x1080)</option>
        <option value="1280x720">720p HD (1280x720)</option>
    </select>

    <button class="btn" id="convert-btn">Convert & Scale Video</button>
    <div class="progress" id="status-message">Ready.</div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        document.getElementById('convert-btn').addEventListener('click', async () => {
            const fileInput = document.getElementById('video-input');
            const resValue = document.getElementById('resolution').value;
            const status = document.getElementById('status-message');

            if (fileInput.files.length === 0) {
                status.innerText = "Please select a 3GP file first!";
                return;
            }

            status.innerText = "Loading FFmpeg engine (this takes a moment)...";
            if (!ffmpeg.isLoaded()) { await ffmpeg.load(); }

            status.innerText = "Processing and upscaling video files...";
            const file = fileInput.files[0];
            
            // Write the file to FFmpeg's virtual memory file system
            ffmpeg.FS('writeFile', 'input.3gp', await fetchFile(file));

            // Execute the FFmpeg command line: scale video and output to MP4
            // -vf "scale=1920:1080" forces the resolution change
            await ffmpeg.run('-i', 'input.3gp', '-vf', `scale=${resValue.replace('x', ':')}`, 'output.mp4');

            status.innerText = "Conversion complete! Downloading...";
            
            // Read back the finalized MP4 file from the virtual file system
            const data = ffmpeg.FS('readFile', 'output.mp4');

            // Trigger a browser download anchor link
            const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(videoBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'upscaled_video.mp4';
            a.click();
            
            status.innerText = "Done!";
        });
    </script>
</body>
</html>
