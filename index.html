<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Text-Based AI</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1e20;
            --text-color: #e3e3e3;
            --user-msg: #2b2a33;
            --ai-msg: #1e1e20;
            --accent: #a8c7fa;
            --input-bg: #282a2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Configuration Header */
        #config-bar {
            background-color: #000;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        #api-key-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .user {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        .system-status {
            align-self: center;
            background: none;
            color: #888;
            font-size: 13px;
        }

        /* Input Area */
        #input-container {
            padding: 20px;
            background-color: var(--bg-color);
        }

        #input-form {
            display: flex;
            max-width: 800px;
            margin: 0 auto;
            background: var(--input-bg);
            border-radius: 28px;
            padding: 6px 12px;
            border: 1px solid #444;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 10px;
            font-size: 16px;
            outline: none;
            resize: none;
            height: 24px;
            font-family: inherit;
        }

        #send-btn {
            background: var(--accent);
            color: #042100;
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        #send-btn:hover {
            opacity: 0.9;
        }

        #send-btn:disabled {
            background: #444;
            color: #777;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Top bar to securely handle credentials locally -->
    <div id="config-bar">
        <input type="password" id="api-key-input" placeholder="Paste your OpenAI API Key here (sk-...)" />
    </div>

    <!-- Chat Message Window -->
    <div id="chat-container">
        <div class="message ai">Hello! I am your custom text-based AI. Paste your API key above to start talking to me.</div>
    </div>

    <!-- Message Input Dock -->
    <div id="input-container">
        <form id="input-form">
            <textarea id="user-input" placeholder="Ask me anything..." required></textarea>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');
        const sendBtn = document.getElementById('send-btn');

        // Main thread message memory history to keep context smart
        let conversationHistory = [
            { role: "system", content: "You are a helpful, clear, and highly intelligent AI assistant." }
        ];

        // Handle auto-expanding textarea behavior
        userInput.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = (this.scrollHeight - 10) + 'px';
        });

        // Submit message action
        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("Please enter your OpenAI API key in the top bar first.");
                return;
            }

            // Disable UI elements during stream/fetch loop
            userInput.value = '';
            userInput.style.height = '24px';
            setLoadingState(true);

            // Append and render user message locally
            appendMessage(text, 'user');
            conversationHistory.push({ role: "user", content: text });

            // Create container placeholder for upcoming streaming AI text
            const aiMessageDiv = appendMessage('', 'ai');

            try {
                const response = await fetch('https://openai.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", // Cost-effective, high-speed model
                        messages: conversationHistory,
                        stream: true // Stream text chunk-by-chunk for premium app speed
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'API request failed');
                }

                // Process standard HTTP text stream server events (SSE)
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiResponseText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        const cleanedLine = line.trim();
                        if (!cleanedLine || cleanedLine === 'data: [DONE]') continue;
                        
                        if (cleanedLine.startsWith('data: ')) {
                            try {
                                const parsed = JSON.parse(cleanedLine.slice(6));
                                const content = parsed.choices[0]?.delta?.content || '';
                                aiResponseText += content;
                                aiMessageDiv.innerText = aiResponseText;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            } catch (e) {
                                // Suppress minor layout parsing edge chunks
                            }
                        }
                    }
                }

                // Commit structured AI response context into continuous memory history
                conversationHistory.push({ role: "assistant", content: aiResponseText });

            } catch (error) {
                console.error(error);
                aiMessageDiv.innerText = `Error: ${error.message}`;
                aiMessageDiv.style.color = '#ff6b6b';
            } finally {
                setLoadingState(false);
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function setLoadingState(isLoading) {
            if (isLoading) {
                sendBtn.disabled = true;
                sendBtn.innerText = "...";
            } else {
                sendBtn.disabled = false;
                sendBtn.innerText = "Send";
                userInput.focus();
            }
        }

        // Allow entering text via 'Enter' key unless Shift is pressed
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                inputForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
