<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dave Chappelle & Crew Live Chat Archive</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0f;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .chat-dashboard {
            display: flex;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            max-width: 950px;
            width: 100%;
            height: 600px;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            border-right: 1px solid #27272a;
            box-sizing: border-box;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #eab308;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .sidebar-title {
            font-size: 20px;
            color: #f4f4f5;
            font-weight: 700;
            margin-bottom: 5px;
            text-align: center;
        }
        .sidebar-status {
            font-size: 13px;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .sidebar-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
        }
        .sidebar-desc {
            font-size: 13px;
            color: #71717a;
            text-align: center;
            margin-top: 25px;
            line-height: 1.5;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #111113;
        }
        .chat-header {
            padding: 20px 30px;
            background-color: #18181b;
            border-bottom: 1px solid #27272a;
            font-weight: 600;
            font-size: 16px;
            color: #f4f4f5;
        }
        .chat-history {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .msg-row {
            display: flex;
            width: 100%;
        }
        .msg-row.incoming { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.outgoing { justify-content: flex-start; }
        
        .msg-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .incoming .msg-bubble {
            background-color: #27272a;
            color: #f4f4f5;
            border-bottom-left-radius: 4px;
        }
        .user .msg-bubble {
            background-color: #3b82f6;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .outgoing .msg-bubble {
            background-color: #eab308;
            color: #09090b;
            font-weight: 600;
            border-bottom-left-radius: 4px;
        }
        .msg-sender {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
            opacity: 0.6;
        }
        .chat-footer {
            padding: 15px 20px;
            background-color: #18181b;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            padding: 12px 20px;
            color: #f4f4f5;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #eab308;
        }
        button {
            background-color: #eab308;
            color: #09090b;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #ca8a04; }
        @media (max-width: 768px) {
            .chat-dashboard { flex-direction: column; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #27272a; }
        }
    </style>
</head>
<body>

<div class="chat-dashboard">
    <div class="sidebar">
        <img class="profile-pic" src="https://unsplash.com" alt="Chappelle & Crew">
        <div class="sidebar-title">Dave &amp; Crew</div>
        <div class="sidebar-status">Live Archive</div>
        <div class="sidebar-desc">Type "next" into the text bar to generate the performance blocks sequentially.</div>
    </div>
    
    <div class="chat-area">
        <div class="chat-header">Retro Comedy Session</div>
        <div class="chat-history" id="chatHistory">
            <div class="msg-row incoming">
                <div class="msg-bubble">
                    <span class="msg-sender">System</span>
                    Type <strong>next</strong> in the message box below to get started!
                </div>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Type 'next' here..." onkeydown="if(event.key === 'Enter') handleSend()">
            <button onclick="handleSend()">Send</button>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playMessageChime() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    function playLaughTrack() {
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "triangle";
                const baseFreq = 150 + Math.random() * 80;
                osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq - 40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }, i * 45);
        }
    }
