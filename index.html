<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Text AI</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1e20;
            --text-color: #e3e3e3;
            --user-msg: #2b2a33;
            --ai-msg: #1e1e20;
            --accent: #a8c7fa;
            --input-bg: #282a2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #config-bar {
            background-color: #000;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid #333;
        }
        #api-key-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .save-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #aaa;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }
        #input-container {
            padding: 15px;
            background-color: var(--bg-color);
        }
        #input-form {
            display: flex;
            background: var(--input-bg);
            border-radius: 28px;
            padding: 6px 12px;
            border: 1px solid #444;
            align-items: center;
        }
        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 10px;
            font-size: 16px;
            outline: none;
            resize: none;
            height: 24px;
            font-family: inherit;
        }
        #send-btn {
            background: var(--accent);
            color: #042100;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #send-btn:disabled {
            background: #444;
            color: #777;
        }
    </style>
</head>
<body>

    <div id="config-bar">
        <input type="password" id="api-key-input" placeholder="Paste your AQ. Key here..." />
        <div class="save-container">
            <input type="checkbox" id="save-key-checkbox">
            <label for="save-key-checkbox">Remember Key on this Phone</label>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">System Updated. Key formatting patched. Type below to text your AI.</div>
    </div>

    <div id="input-container">
        <form id="input-form">
            <textarea id="user-input" placeholder="Message your AI..." required></textarea>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveKeyCheckbox = document.getElementById('save-key-checkbox');
        const sendBtn = document.getElementById('send-btn');

        let conversationHistory = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_key_v3');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                saveKeyCheckbox.checked = true;
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = (this.scrollHeight - 10) + 'px';
        });

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("Please paste your key.");
                return;
            }

            if (saveKeyCheckbox.checked) {
                localStorage.setItem('gemini_key_v3', apiKey);
            } else {
                localStorage.removeItem('gemini_key_v3');
            }

            userInput.value = '';
            userInput.style.height = '24px';
            setLoading(true);

            appendMessage(text, 'user');
            conversationHistory.push({ role: "user", parts: [{ text: text }] });

            const aiMessageDiv = appendMessage('Thinking...', 'ai');

            try {
                // Passing the key securely in the URL resolves CORS fetch blocks on mobile devices
                const response = await fetch(`https://googleapis.com{apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || 'Connection failed.');
                }

                const aiResponseText = data.candidates[0].content.parts[0].text;
                aiMessageDiv.innerText = aiResponseText;
                
                conversationHistory.push({ role: "model", parts: [{ text: aiResponseText }] });
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                aiMessageDiv.innerText = `Error: ${error.message}`;
                aiMessageDiv.style.color = '#ff6b6b';
            } finally {
                setLoading(false);
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                sendBtn.disabled = true;
                sendBtn.innerText = "...";
            } else {
                sendBtn.disabled = false;
                sendBtn.innerText = "Send";
            }
        }
    </script>
</body>
</html>
