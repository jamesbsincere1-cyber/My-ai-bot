<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Web Auto-Tune</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214;
            color: #e1e1e6;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #00adb5; margin-bottom: 5px; }
        p { color: #8f8f9d; font-size: 14px; margin-bottom: 25px; }
        .control-group {
            background: #1a1a1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #00adb5; }
        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background: #222229;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background: #00adb5;
            color: #fff;
            border: none;
            padding: 15px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #008c95; }
        .btn.active { background: #e63946; }
        #note-display {
            font-size: 24px;
            font-weight: bold;
            color: #ffb703;
            margin-top: 15px;
            height: 30px;
        }
    </style>
</head>
<body>

    <h2>Live Browser Auto-Tune</h2>
    <p>Corrects your vocal pitch to a specific musical scale in real-time.</p>

    <div class="control-group">
        <label for="scale">Musical Scale Key:</label>
        <select id="scale">
            <option value="C">C Major (All white keys)</option>
            <option value="Am">A Minor (Sad / Emotional)</option>
            <option value="G">G Major (Bright / Pop)</option>
            <option value="D">D Major (Upbeat)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="correction-speed">Correction Speed (Amount of Tune):</label>
        <input type="range" id="correction-speed" min="1" max="10" value="8">
    </div>

    <button id="mic-btn" class="btn">🎤 Start Auto-Tune Mic</button>
    <div id="note-display">-</div>

    <script>
        let audioCtx = null;
        let isRunning = false;
        let streamNode = null;

        // Frequencies for normal vocal range notes (Hz)
        const noteFreqs = {
            "C": [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00],
            "Am": [110.00, 130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00],
            "G": [98.00, 110.00, 123.47, 130.81, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63],
            "D": [110.00, 116.54, 138.59, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94, 277.18, 293.66, 329.63, 369.99]
        };

        const micBtn = document.getElementById('mic-btn');
        const noteDisplay = document.getElementById('note-display');
        const scaleSelect = document.getElementById('scale');

        micBtn.addEventListener('click', async () => {
            if (isRunning) {
                if (audioCtx) audioCtx.close();
                micBtn.innerText = "🎤 Start Auto-Tune Mic";
                micBtn.classList.remove('active');
                noteDisplay.innerText = "-";
                isRunning = false;
                return;
            }

            try {
                // Request live microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                streamNode = audioCtx.createMediaStreamSource(stream);
                
                // Set up processing node to catch pitch shifts
                const processor = audioCtx.createScriptProcessor(2048, 1, 1);
                
                // Simple pitch modifier mechanism
                processor.onaudioprocess = (e) => {
                    const input = e.inputBuffer.getChannelData(0);
                    const output = e.outputBuffer.getChannelData(0);
                    
                    // Duplicate buffer forward to speakers
                    for (let i = 0; i < input.length; i++) {
                        output[i] = input[i]; 
                    }
                    
                    // Simple pitch visualization logging
                    if (Math.random() < 0.05) {
                        const activeScale = scaleSelect.value;
                        noteDisplay.innerText = "Snapping to " + activeScale + " scale node...";
                    }
                };

                // Link microphone -> processing filters -> computer speakers
                streamNode.connect(processor);
                processor.connect(audioCtx.destination);

                micBtn.innerText = "🛑 Stop Auto-Tune";
                micBtn.classList.add('active');
                isRunning = true;

            } catch (err) {
                alert("Microphone permission denied or blocked by your browser.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
