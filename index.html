<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Mobile Evader</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            /* Prevents phone screen from bouncing on swipe */
            position: fixed;
            width: 100%;
        }

        #ui-layer {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        /* The 2D Graphic viewport box */
        canvas {
            background-color: #222;
            border: 2px solid #555;
            max-width: 90vw;
            max-height: 50vh;
            border-radius: 8px;
        }

        #controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            width: 80%;
            justify-content: center;
        }

        .btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            /* Prevents phone zoom double-tap delay */
            touch-action: manipulation; 
        }

        .btn:active {
            background-color: #888;
        }
    </style>
</head>
<body>

    <div id="ui-layer">SCORE: <span id="score-val">0</span></div>
    
    <!-- This box draws the actual graphics -->
    <canvas id="gameCanvas" width="300" height="400"></canvas>

    <!-- Mobile Button Dock -->
    <div id="controls">
        <button class="btn" id="left-btn">◀</button>
        <button class="btn" id="right-btn">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d'); // Pull the 2D draw engine
        const scoreDisplay = document.getElementById('score-val');

        let score = 0;
        let isGameOver = false;

        // Player configuration
        let player = {
            x: 135,
            y: 360,
            width: 30,
            height: 30,
            speed: 15,
            color: '#00ffcc'
        };

        // Falling hazards array
        let obstacles = [];
        let obstacleSpeed = 3;
        let spawnRate = 0.02; // Chance to generate each frame

        // Touch Control Listeners
        document.getElementById('left-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.x > 0) player.x -= player.speed;
        });

        document.getElementById('right-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.x < canvas.width - player.width) player.x += player.speed;
        });

        // Fallback Click Listeners for standard browser view
        document.getElementById('left-btn').addEventListener('click', () => {
            if (player.x > 0) player.x -= player.speed;
        });
        document.getElementById('right-btn').addEventListener('click', () => {
            if (player.x < canvas.width - player.width) player.x += player.speed;
        });

        // Main game cycle frame updates
        function update() {
            if (isGameOver) return;

            // 1. Spawning Mechanics
            if (Math.random() < spawnRate) {
                let size = Math.floor(Math.random() * 20) + 15;
                obstacles.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    color: '#ff4444'
                });
            }

            // 2. Physics & Positions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacleSpeed;

                // Collision detection check
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                // Delete off-screen obstacles and add points
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreDisplay.innerText = score;

                    // Gradually speed up game difficulty
                    if (score % 10 === 0) {
                        obstacleSpeed += 0.5;
                        spawnRate += 0.005;
                    }
                }
            }
        }

        // Draw loop handler
        function render() {
            // Clear entire display box each frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player square
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw obstacle items
            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Game over screen print
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                
                ctx.font = '14px Arial';
                ctx.fillText("Refresh browser to retry", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        // Perpetual animation runner loop
        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        // Start execution
        loop();
    </script>
</body>
</html>
